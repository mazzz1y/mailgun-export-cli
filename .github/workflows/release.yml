name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for platform in "${platforms[@]}"; do
            GOOS="${platform%%/*}"
            GOARCH="${platform##*/}"
            output_name="mailgun-export-csv-${GOOS}-${GOARCH}"
            binary_name="${output_name}"

            if [ "$GOOS" = "windows" ]; then
              binary_name="${output_name}.exe"
            fi

            echo "Building for ${GOOS}/${GOARCH}..."
            GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-s -w" \
              -trimpath \
              -o "dist/${binary_name}" \
              ./cmd/mailgun-export-csv

            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q "${output_name}.zip" "${binary_name}")
            else
              tar -czf "dist/${output_name}.tar.gz" -C dist "${binary_name}"
            fi
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt
